<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KinSushi GitHub profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.52" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#102A43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="0.48" stop-color="#2EA043"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <path d="M0 310 C220 245 310 352 520 295 C760 230 870 310 1280 220" stroke="url(#accent)" stroke-width="4" opacity="0.75"/>
  <path d="M0 95 C240 45 420 140 640 90 C890 33 980 92 1280 45" stroke="#58A6FF" stroke-width="2" opacity="0.22"/>

  <g opacity="0.20">
    <circle cx="1035" cy="96" r="74" stroke="#58A6FF" stroke-width="2"/>
    <circle cx="1110" cy="185" r="46" stroke="#2EA043" stroke-width="2"/>
    <circle cx="960" cy="228" r="30" stroke="#A371F7" stroke-width="2"/>
    <path d="M1035 96 L1110 185 L960 228 L1035 96" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <g filter="url(#glow)">
    <text x="80" y="112" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="50" font-weight="700">Enzo · KinSushi</text>
    <text x="80" y="166" fill="#D8E2F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="500">Data / MLOps Engineering for Regulated &amp; Data-Intensive Systems</text>
    <text x="80" y="220" fill="#9FB3C8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">Python · SQL · Linux · MLflow · Docker · CI/CD · Data Quality · AI Governance</text>
  </g>

  <g>
    <rect x="80" y="258" width="178" height="38" rx="19" fill="#0D419D" opacity="0.9"/>
    <text x="104" y="283" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Swiss Ecosystem</text>
    <rect x="274" y="258" width="190" height="38" rx="19" fill="#1A7F37" opacity="0.9"/>
    <text x="298" y="283" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Technical Evidence</text>
    <rect x="480" y="258" width="172" height="38" rx="19" fill="#6E40C9" opacity="0.9"/>
    <text x="504" y="283" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Public Portfolio</text>
  </g>
</svg>
