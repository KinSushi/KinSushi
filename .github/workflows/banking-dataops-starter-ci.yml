name: banking-dataops-starter-ci

on:
  push:
    paths:
      - "starters/banking-dataops-monitoring/**"
      - ".github/workflows/banking-dataops-starter-ci.yml"
  pull_request:
    paths:
      - "starters/banking-dataops-monitoring/**"
      - ".github/workflows/banking-dataops-starter-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starters/banking-dataops-monitoring

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
