[project]
name = "banking-dataops-monitoring"
version = "0.1.0"
description = "Synthetic regulated-data monitoring lab with PostgreSQL, SQL controls, Python and Streamlit."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]",
    "pandas",
    "pydantic",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
